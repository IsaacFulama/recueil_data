name: Validation du JSON des Cantiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Valider le fichier JSON
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe JSON
        run: python -m json.tool cantiques.json > /dev/null

      - name: Confirmer la validation
        run: echo "Le fichier cantiques.json est un JSON syntaxiquement valide."
